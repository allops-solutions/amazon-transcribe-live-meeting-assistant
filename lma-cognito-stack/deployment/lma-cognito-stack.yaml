---
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Amazon Transcribe Live Meeting Assist - Cognito Stack

Parameters:
  SsoCompatiblePool:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Use mutable email on a NEW pool only; never enable on a legacy pool.
  EnableGoogleSso:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  GoogleOAuthClientId:
    Type: String
    Default: ""
  GoogleOAuthClientSecret:
    Type: String
    Default: ""
    NoEcho: true
  FederatedEmailDomain:
    Type: String
    Default: allops.co
    AllowedPattern: '^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+$'
  GoogleAdminEmail:
    Type: String
    Default: ""
    Description: Verified Google email explicitly granted Admin at token issuance.
  PasswordSignInEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  # Required
  LMAStackName:
    Type: String
    Description: LMA Stack Name

  LMASettingsParameterName:
    Type: String
    Description: LMA settings SSM Parameter store

  S3BucketName:
    Type: String
    Default: ""
    Description: >
      Existing bucket where call recording files will be stored.
    # yamllint disable rule:line-length
    AllowedPattern: '( *|(?=^.{3,63}$)(?!^(\d+\.)+\d+$)(^(([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])\.)*([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])$))'
    # yamllint enable rule:line-length

  AdminEmail:
    Type: String
    Description: >-
      Email address of the admin user (e.g. jdoe+admin@example.com) that has access to all meetings 
      for administrative purposes. 
      An initial temporary password will be automatically sent to this user via email.
    AllowedPattern: '^[\w.+-]+@([\w-]+\.)+[\w-]{2,6}$'

  AllowedSignUpEmailDomain:
    Type: String
    Default: ""
    Description: >-
      Email address domain (example.com) or comma separated list of email domains  (example1.com,
      example2.com) allowed to signin and signup using the web UI.
      If left empty, signup via the web UI is disabled and users will have to be created
      using
      Cognito.
    AllowedPattern: '^(|([\w-]+\.)+[\w-]{2,6}(, *([\w-]+\.)+[\w-]{2,6})*)$'

  # NOTE: These parameters are dynamically updated during release
  BootstrapBucketBaseName:
    Type: String
    Default: aws-bigdata-blog
    Description: >-
      Base name of bootstrap S3 bucket. The region is appended to the bucket name.
      For example if
      you provide a base name `mybucket`, a bucket with a region suffix must exist
      in the region
      you are deploying (e.g. `mybucket-us-east-1`)
      The bucket contains pre-staged packaged templates and source artifacts
    # yamllint disable rule:line-length
    AllowedPattern: '(?=^.{3,63}$)(?!^(\d+\.)+\d+$)(^(([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])\.)*([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])$)'
    # yamllint enable rule:line-length

  BootstrapS3Prefix:
    Type: String
    Default: artifacts/lca
    Description: >
      S3 prefix where the templates and source are stored under

  BootstrapVersion:
    Type: String
    Default: 0.1.9
    Description: >
      Artifacts version (semver). Used to point to a specific release in the S3
      bootstrap bucket

  CloudWatchLogsExpirationInDays:
    Type: Number
    Default: 14
    Description: The number of days log events are kept in CloudWatch Logs.

  CustomerManagedEncryptionKeyArn:
    Type: String
    Description: ARN of the customer managed KMS key for encryption

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of an existing IAM managed policy to use as permissions boundary for IAM roles.
      If provided, this policy will limit the maximum permissions that can be granted to IAM roles
      in this stack, providing an additional layer of security.

  LMAVersion:
    Type: String
    Default: "0.0.0"
    Description: LMA release version (used in welcome email footer)

  BuildDateTime:
    Type: String
    Default: ""
    Description: LMA build date/time (used in welcome email footer)

Rules:
  GoogleConfiguration:
    RuleCondition: !Equals [!Ref EnableGoogleSso, "true"]
    Assertions:
      - Assert: !Equals [!Ref SsoCompatiblePool, "true"]
        AssertDescription: Google requires a newly created SSO-compatible pool.
      - Assert: !Not [!Equals [!Ref GoogleOAuthClientId, ""]]
        AssertDescription: Google client ID is required.
      - Assert: !Not [!Equals [!Ref GoogleOAuthClientSecret, ""]]
        AssertDescription: Google client secret is required.
  PasswordConfiguration:
    RuleCondition: !Equals [!Ref PasswordSignInEnabled, "false"]
    Assertions:
      - Assert: !Equals [!Ref EnableGoogleSso, "true"]
        AssertDescription: Disabling passwords requires Google federation.

Conditions:
  IsSsoCompatiblePool: !Equals [!Ref SsoCompatiblePool, "true"]
  ShouldEnablePasswordSignIn: !Equals [!Ref PasswordSignInEnabled, "true"]
  ShouldAllowSignUpEmailDomain:
    !Not [!Equals [!Ref AllowedSignUpEmailDomain, ""]]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Outputs:
  CognitoLoginUrl:
    Value: !Sub https://${LMAUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  CognitoClientId:
    Value: !Ref UserPoolClient
  CognitoAuthRoleArn:
    Value: !GetAtt CognitoAuthorizedRole.Arn
  UserPoolId:
    Description: >-
      The id of Cognito user pool.
    Value: !Ref UserPool
  UserPoolArn:
    Description: The ARN of the Cognito User Pool
    Value: !GetAtt UserPool.Arn
  CognitoUserPoolDomain:
    Description: The Cognito User Pool Domain
    Value: !Ref LMAUserPoolDomain
  AppIdentityPoolId:
    Description: The Id for the App Cognito Identity Pool 
    Value: !Ref IdentityPool

Resources:

  ##########################################################################
  # Cognito
  # Sample Cognito resources
  ##########################################################################
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If
          - IsSsoCompatiblePool
          - true
          - !If [ShouldAllowSignUpEmailDomain, false, true]
        InviteMessageTemplate:
          EmailSubject: Welcome to Live Meeting Assistant!
          EmailMessage: !Sub |-
            <p>Hello {username},</p>
            <p>Welcome to Live Meeting Assistant (LMA)! Your temporary password is: <strong>{####}</strong></p>
            <p>When the CloudFormation stack is COMPLETE, navigate to the Outputs tab of your CloudFormation stack and get the URL associated with ApplicationCloudfrontEndpoint. This is your LMA web interface. When you first login, it will prompt you to set a permanent password.</p> 
            <p>Don't attempt to download the Chrome browser extension from LMA until the 
            CloudFormation stack status is CREATE_COMPLETE or UPDATE_COMPLETE, as the 
            extension will not be available until then.</p>
            <p>Thanks,</p>
            <p>Live Meeting Assistant (amazon.com/live-meeting-assistant)</p>
            <p><em>Stack: ${LMAStackName}, v${LMAVersion}, ${BuildDateTime}</em></p>
      AutoVerifiedAttributes:
        - email
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      EmailVerificationMessage: >-
        Please verify your email to complete account registration. Confirmation Code
        {####}.
      EmailVerificationSubject: >-
        Account Verification
      LambdaConfig:
        CustomMessage: !GetAtt CognitoCustomMessageFunction.Arn
        PreAuthentication: !If
          - ShouldAllowSignUpEmailDomain
          - !GetAtt CognitoUserPoolEmailDomainVerifyFunction.Arn
          - !Ref AWS::NoValue
        PreSignUp: !If
          - IsSsoCompatiblePool
          - !GetAtt FederatedSignInGuard.Arn
          - !If [ShouldAllowSignUpEmailDomain, !GetAtt CognitoUserPoolEmailDomainVerifyFunction.Arn, !Ref AWS::NoValue]
        PreTokenGeneration: !If
          - IsSsoCompatiblePool
          - !GetAtt FederatedSignInGuard.Arn
          - !Ref AWS::NoValue
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: !If [IsSsoCompatiblePool, true, false]
          Required: true
      UsernameConfiguration:
        CaseSensitive: false
      UserPoolName: !Sub "${AWS::StackName}-UserPool"

  GetDomainLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue

  GetDomainLambda:
    Type: "AWS::Lambda::Function"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access as it only interacts with AWS services via APIs
          - id: W92
            reason: Function does not require reserved concurrency as it scales based on demand
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    Properties:
      Description: Returns the lowercase version of a string
      MemorySize: 256
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt GetDomainLambdaRole.Arn
      Timeout: 30
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import cfnresponse
          import time
          def lambda_handler(event, context):                                                    
              output = event['ResourceProperties'].get('InputString', '').lower()
              output = f"{output}-{time.time_ns()}" # make unique
              responseData = {'OutputString': output}                                            
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/GetDomainLambda
    DependsOn:
      - GetDomainLambdaLogGroup

  GetDomainLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/GetDomainLambda
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  GetDomain:
    Type: Custom::GetDomain
    Properties:
      ServiceToken: !GetAtt GetDomainLambda.Arn
      InputString: !Ref LMAStackName

  LMAUserPoolDomain:
    Type: "AWS::Cognito::UserPoolDomain"
    Properties:
      Domain: !GetAtt GetDomain.OutputString
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - phone
        - profile
      CallbackURLs:
        - http://localhost:3000/
        - https://bmpfinegchjaiocjnfjfcgeohdiblomp.chromiumapp.org/
      AccessTokenValidity: 1
      ClientName: !Sub "${AWS::StackName}-Client"
      EnableTokenRevocation: true
      ExplicitAuthFlows: !If
        - ShouldEnablePasswordSignIn
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
        - [ALLOW_REFRESH_TOKEN_AUTH]
      GenerateSecret: false  # pragma: allowlist secret
      IdTokenValidity: 1
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
        - email_verified
        - preferred_username
      RefreshTokenValidity: 30
      # AISTACK registers the CloudFront OIDC adapter after its endpoint exists.
      SupportedIdentityProviders: [COGNITO]
      UserPoolId: !Ref UserPool

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${AWS::StackName}-IdentityPool"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  CognitoIdentityPoolSetRole:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthorizedRole.Arn

  CognitoAuthorizedRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: accessS3RecordingsPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                Resource:
                  - !Sub
                    - "arn:aws:s3:::${bucket}"
                    - bucket: !Ref S3BucketName
                  - !Sub
                    - "arn:aws:s3:::${bucket}/*"
                    - bucket: !Ref S3BucketName
        - PolicyName: accessParameterStore
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${LMASettingsParameterName}"
        - PolicyName: accessTranslateAPI
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - translate:TranslateText
                  - comprehend:DetectDominantLanguage
                Resource: "*"
        - PolicyName: executeStepfunctions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - states:StartSyncExecution
                  - states:StartExecution
                Resource:
                  - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${LMAStackName}-LMAVirtualParticipantScheduler"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason:
              comprehend, translate, and connect do not support resource-level
              permissions

  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: ShouldEnablePasswordSignIn
    DependsOn: CognitoUserPoolEmailDomainVerifyPermissionReady
    Properties:
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
      Username: !Ref AdminEmail
      UserPoolId: !Ref UserPool

  CognitoUserPoolEmailDomainVerifyPermissionReady:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      FederatedGuardReady: !If [IsSsoCompatiblePool, !Ref FederatedSignInGuardPermission, "disabled"]
      SecondaryCIDRready:
        !If [
          ShouldAllowSignUpEmailDomain,
          !Ref CognitoUserPoolEmailDomainVerifyPermission,
          "",
        ]
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      Description: Administrators
      GroupName: Admin
      Precedence: 0
      UserPoolId: !Ref UserPool

  AdminUserToGroupAttachment:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: ShouldEnablePasswordSignIn
    Properties:
      GroupName: !Ref AdminGroup
      Username: !Ref AdminUser
      UserPoolId: !Ref UserPool

  CognitoUserPoolEmailDomainVerifyFunction:
    Type: AWS::Serverless::Function
    Condition: ShouldAllowSignUpEmailDomain
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 10
      Environment:
        Variables:
          ALLOWED_SIGNUP_EMAIL_DOMAINS: !Ref AllowedSignUpEmailDomain
      InlineCode: |
        import os
        import boto3
        import json
        
        def lambda_handler(event, context):
            print(json.dumps(event))
        
            allowed_domains = [
                domain.strip() 
                for domain in os.environ.get('ALLOWED_SIGNUP_EMAIL_DOMAINS', '').split(',')
            ]
        
            user_attributes = event.get('request', {}).get('userAttributes', {})
            email = user_attributes.get('email')
        
            if not email or '@' not in email:
                raise ValueError('Username does not exist or invalid email address')
        
            email_domain = email.split('@')[1]
        
            if not email_domain or not allowed_domains:
                raise ValueError('Server error - invalid configuration')
        
            if email_domain not in allowed_domains:
                raise ValueError('Invalid email address domain')
        
            return event
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/CognitoUserPoolEmailDomainVerifyFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    DependsOn:
      - CognitoUserPoolEmailDomainVerifyFunctionLogGroup

  CognitoUserPoolEmailDomainVerifyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/CognitoUserPoolEmailDomainVerifyFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  CognitoUserPoolEmailDomainVerifyPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldAllowSignUpEmailDomain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoUserPoolEmailDomainVerifyFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt UserPool.Arn

  ##########################################################################
  # Cognito CustomMessage trigger
  #
  # Customizes the AdminCreateUser invitation email so it includes the
  # clickable LMA web UI (CloudFront) URL. The URL is read from the LMA
  # Settings SSM parameter, which is populated by AISTACK after the
  # CloudFront distribution exists. For the initial admin user (created
  # at stack-create time before AISTACK populates the parameter), the
  # Lambda falls back to the default wording that references the
  # CloudFormation Outputs tab.
  #
  # For other CustomMessage trigger sources (forgot password, verify
  # email, resend code, etc.) the Lambda returns the event untouched so
  # Cognito's default messages continue to be used.
  ##########################################################################

  CognitoCustomMessageFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: ReadLMASettings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${LMASettingsParameterName}"

  CognitoCustomMessageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/CognitoCustomMessageFunction
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  CognitoCustomMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 256
      Role: !GetAtt CognitoCustomMessageFunctionRole.Arn
      Environment:
        Variables:
          LMA_SETTINGS_PARAMETER: !Ref LMASettingsParameterName
          LMA_STACK_NAME: !Ref LMAStackName
          LMA_VERSION: !Ref LMAVersion
          LMA_BUILD_DATETIME: !Ref BuildDateTime
      InlineCode: |
        # Cognito CustomMessage trigger for LMA. Reads the CloudFront URL
        # (if present) from the LMA Settings SSM parameter and injects it
        # into the AdminCreateUser invitation email. Falls back to the
        # default wording if the URL is not yet available (e.g. at initial
        # stack create time, before AISTACK has populated the parameter).
        import html
        import json
        import logging
        import os

        import boto3

        logger = logging.getLogger()
        logger.setLevel(logging.INFO)

        ssm = boto3.client("ssm")

        PARAM_NAME = os.environ.get("LMA_SETTINGS_PARAMETER", "")
        STACK_NAME = os.environ.get("LMA_STACK_NAME", "")
        VERSION = os.environ.get("LMA_VERSION", "")
        BUILD_DT = os.environ.get("LMA_BUILD_DATETIME", "")


        def _get_cloudfront_url():
            if not PARAM_NAME:
                return ""
            try:
                resp = ssm.get_parameter(Name=PARAM_NAME)
                raw = resp.get("Parameter", {}).get("Value", "")
                if not raw:
                    return ""
                settings = json.loads(raw)
                return (settings.get("CloudFrontEndpoint") or "").strip()
            except Exception as exc:  # pylint: disable=broad-except
                logger.warning("Could not read LMA settings parameter: %s", exc)
                return ""


        def lambda_handler(event, _context):
            logger.info("Event: %s", json.dumps(event))

            trigger = event.get("triggerSource", "")
            # Only customize the admin-create-user invitation email.
            # Leave all other CustomMessage triggers (forgot password, verify
            # email, resend code, etc.) untouched so Cognito defaults apply.
            if trigger != "CustomMessage_AdminCreateUser":
                return event

            req = event.get("request", {}) or {}
            code = req.get("codeParameter", "{####}")
            username = html.escape(req.get("usernameParameter", "") or "")
            url = _get_cloudfront_url()

            event.setdefault("response", {})
            event["response"]["emailSubject"] = "Welcome to Live Meeting Assistant!"

            if url:
                safe_url = html.escape(url, quote=True)
                event["response"]["emailMessage"] = (
                    f"<p>Hello {username},</p>"
                    f"<p>Welcome to Live Meeting Assistant (LMA)! Your temporary password is: <strong>{code}</strong></p>"
                    f"<p>Sign in to LMA at "
                    f"<a href=\"{safe_url}\">{safe_url}</a>. "
                    f"You'll be prompted to set a permanent password on first sign-in.</p>"
                    f"<p>Thanks,</p>"
                    f"<p>Live Meeting Assistant (amazon.com/live-meeting-assistant)</p>"
                    f"<p><em>Stack: {html.escape(STACK_NAME)}, v{html.escape(VERSION)}, {html.escape(BUILD_DT)}</em></p>"
                )
            else:
                # Fallback: AISTACK hasn't populated CloudFrontEndpoint yet
                # (e.g. initial stack creation).
                event["response"]["emailMessage"] = (
                    f"<p>Hello {username},</p>"
                    f"<p>Welcome to Live Meeting Assistant (LMA)! Your temporary password is: <strong>{code}</strong></p>"
                    f"<p>When the CloudFormation stack is COMPLETE, navigate to the Outputs tab of your "
                    f"CloudFormation stack and get the URL associated with ApplicationCloudfrontEndpoint. "
                    f"This is your LMA web interface. When you first login, it will prompt you to set a permanent password.</p>"
                    f"<p>Don't attempt to download the Chrome browser extension from LMA until the "
                    f"CloudFormation stack status is CREATE_COMPLETE or UPDATE_COMPLETE, as the "
                    f"extension will not be available until then.</p>"
                    f"<p>Thanks,</p>"
                    f"<p>Live Meeting Assistant (amazon.com/live-meeting-assistant)</p>"
                    f"<p><em>Stack: {html.escape(STACK_NAME)}, v{html.escape(VERSION)}, {html.escape(BUILD_DT)}</em></p>"
                )
            return event
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/CognitoCustomMessageFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cognito trigger"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - CognitoCustomMessageFunctionLogGroup

  CognitoCustomMessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoCustomMessageFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt UserPool.Arn


  FederatedSignInGuardRole:
    Type: AWS::IAM::Role
    Condition: IsSsoCompatiblePool
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]

  # Separate policy breaks UserPool -> trigger -> role -> UserPool dependency.
  FederatedSignInGuardAdminPolicy:
    Type: AWS::IAM::Policy
    Condition: IsSsoCompatiblePool
    Properties:
      PolicyName: GrantConfiguredGoogleAdmin
      Roles: [!Ref FederatedSignInGuardRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: cognito-idp:AdminAddUserToGroup
            Resource: !GetAtt UserPool.Arn

  FederatedSignInGuardLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsSsoCompatiblePool
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/FederatedSignInGuard"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  FederatedSignInGuard:
    Type: AWS::Serverless::Function
    Condition: IsSsoCompatiblePool
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt FederatedSignInGuardRole.Arn
      Environment:
        Variables:
          ALLOWED_DOMAIN: !Ref FederatedEmailDomain
          GOOGLE_ADMIN_EMAIL: !Ref GoogleAdminEmail
          PASSWORD_SIGN_IN_ENABLED: !Ref PasswordSignInEnabled
      LoggingConfig:
        LogGroup: !Ref FederatedSignInGuardLogGroup
      InlineCode: |
        import json
        import os
        import boto3

        cognito = boto3.client("cognito-idp")
        ALLOWED_DOMAIN = os.environ["ALLOWED_DOMAIN"].strip().lower()
        ADMIN_EMAIL = os.environ.get("GOOGLE_ADMIN_EMAIL", "").strip().lower()
        SSO_ONLY = os.environ.get("PASSWORD_SIGN_IN_ENABLED", "true") != "true"


        def verified_email(attributes):
            email = attributes.get("email", "").strip().lower()
            if (email.count("@") != 1 or not email.split("@")[0]
                    or email.split("@")[1] != ALLOWED_DOMAIN
                    or str(attributes.get("email_verified", "")).lower() != "true"):
                raise ValueError("Use a verified company Google account to sign in.")
            return email


        def lambda_handler(event, context):
            source = event.get("triggerSource", "")
            attributes = event.get("request", {}).get("userAttributes", {})
            if source == "PreSignUp_ExternalProvider":
                if not event.get("userName", "").lower().startswith("googleworkspace_"):
                    raise ValueError("Unsupported sign-in provider.")
                verified_email(attributes)
                return event
            if source.startswith("PreSignUp_"):
                # Admin invitations remain allowed; public password signup stays closed.
                if source != "PreSignUp_AdminCreateUser":
                    raise ValueError("Please use Google sign-in or an administrator invitation.")
                return event
            if source.startswith("TokenGeneration_"):
                try:
                    identities = json.loads(attributes.get("identities", "[]"))
                except (ValueError, TypeError):
                    raise ValueError("Invalid sign-in identity.") from None
                is_google = any(i.get("providerName") == "GoogleWorkspace" for i in identities)
                if not is_google:
                    if SSO_ONLY:
                        raise ValueError("Google sign-in is required.")
                    return event
                email = verified_email(attributes)
                if ADMIN_EMAIL and email == ADMIN_EMAIL:
                    # Explicit CFN bootstrap identity, never arbitrary email linking.
                    cognito.admin_add_user_to_group(
                        UserPoolId=event["userPoolId"], Username=event["userName"],
                        GroupName="Admin")
                    configuration = dict(event.get("request", {}).get("groupConfiguration") or {})
                    groups = list(configuration.get("groupsToOverride") or [])
                    if "Admin" not in groups:
                        groups.append("Admin")
                    configuration["groupsToOverride"] = groups
                    # Cognito can supply an explicit null, which setdefault
                    # does not replace. Preserve any existing claim overrides.
                    response = event.get("response") or {}
                    overrides = response.get("claimsOverrideDetails") or {}
                    overrides["groupOverrideDetails"] = configuration
                    response["claimsOverrideDetails"] = overrides
                    event["response"] = response
                return event
            return event

  FederatedSignInGuardPermission:
    Type: AWS::Lambda::Permission
    Condition: IsSsoCompatiblePool
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FederatedSignInGuard
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt UserPool.Arn
