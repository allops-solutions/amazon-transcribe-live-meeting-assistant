name: LMA inspect OIDC identity
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [production, dev]
        required: true
permissions:
  contents: read
jobs:
  identity:
    if: github.repository == 'allops-solutions/amazon-transcribe-live-meeting-assistant' && github.ref == 'refs/heads/allops-main'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Show only audience and subject, never the token
        shell: python
        run: |
          import base64, json, os, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          print(json.dumps({key: claims[key] for key in ('aud', 'sub')}))
