name: LMA checks
on:
  pull_request:
  push:
    branches: [allops-main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_PROFILE: default
      AWS_CONFIG_FILE: ${{ github.workspace }}/deploy/ci/aws-config.ini
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - run: make setup-python setup-cli-dev setup-npm
      - run: .venv/bin/python -m unittest discover -s deploy/ci/tests -v
      - run: .venv/bin/cfn-lint --non-zero-exit-code error deploy/ci/bootstrap.yaml
      - run: .venv/bin/cfn-lint --non-zero-exit-code error deploy/ci/iam-guardrails.yaml
      - run: .venv/bin/cfn-lint --non-zero-exit-code error deploy/ci/permission-bootstrap.yaml
      - run: .venv/bin/cfn-lint --non-zero-exit-code error deploy/ci/practical-access.yaml
      - run: make lint-cfn test-sdk test-cli test-lambdas test-vp-template lint-ui-force lint-typescript test-vp test-ui-force
